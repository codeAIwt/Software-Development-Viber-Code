name: Online Study System CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: online_study_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'mysql+pymysql://test_user:test_password@127.0.0.1:3306/online_study_test?charset=utf8mb4'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      DB_HOST: '127.0.0.1'
      DB_PORT: '3306'
      DB_USER: 'test_user'
      DB_PASSWORD: 'test_password'
      DB_NAME: 'online_study_test'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install system dependencies for OpenCV
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for MySQL to be ready
      run: |
        cd backend
        python - <<'PY'
        import os, time, sys
        import pymysql

        host = os.environ.get('DB_HOST', '127.0.0.1')
        port = int(os.environ.get('DB_PORT', '3306'))
        user = os.environ.get('DB_USER')
        password = os.environ.get('DB_PASSWORD')
        db = os.environ.get('DB_NAME', 'online_study_test')

        for i in range(60):
            try:
                conn = pymysql.connect(host=host, port=port, user=user, password=password, database=db)
                conn.close()
                print('MySQL is available')
                break
            except Exception as e:
                print('Waiting for MySQL...')
                time.sleep(2)
        else:
            print('MySQL not ready')
            sys.exit(1)
        PY

    - name: Run database initialization test
      run: |
        cd backend
        python - <<'PY'
        from config.db import init_db, engine
        from sqlalchemy import text

        with engine.connect() as conn:
            result = conn.execute(text('SELECT 1'))
            assert result.fetchone()[0] == 1, 'Database connection test failed'
            print('Database connection test passed')

        init_db()
        print('Database initialization test passed')

        with engine.connect() as conn:
            tables = conn.execute(text('SHOW TABLES')).fetchall()
            assert len(tables) > 0, f'No tables found, expected some tables'
            print(f'Found {len(tables)} tables')
        PY

    - name: Run pytest test suite
      run: |
        cd backend
        mkdir -p test-results
        python -m pytest test_integration_strict.py -v --tb=short --junitxml=test-results/backend-test.xml

    - name: Upload backend test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: backend/test-results
        retention-days: 7

    - name: Run code quality checks
      run: |
        cd backend
        python -m py_compile app.py
        python -m py_compile controllers/*.py
        python -m py_compile services/*.py
        python -m py_compile models/*.py
        python -m py_compile utils/*.py
        echo 'All Python files compiled successfully'

  frontend-test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install frontend dependencies
      run: |
        cd frontend
        export NODE_ENV=development
        npm install

    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint || echo 'Linting completed with warnings'

    - name: Build frontend for production
      run: |
        cd frontend
        npm run build

    - name: Verify build output
      run: |
        cd frontend
        if [ -f "dist/index.html" ] && [ -d "dist/assets" ]; then
            echo 'Build output structure verification passed'
        else
            echo 'Build output structure verification failed'
            exit 1
        fi

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: online_study_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'mysql+pymysql://test_user:test_password@127.0.0.1:3306/online_study_test?charset=utf8mb4'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
      DB_HOST: '127.0.0.1'
      DB_PORT: '3306'
      DB_USER: 'test_user'
      DB_PASSWORD: 'test_password'
      DB_NAME: 'online_study_test'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install system dependencies for OpenCV
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for MySQL to be ready
      run: |
        cd backend
        python - <<'PY'
        import os, time, sys
        import pymysql

        host = os.environ.get('DB_HOST', '127.0.0.1')
        port = int(os.environ.get('DB_PORT', '3306'))
        user = os.environ.get('DB_USER')
        password = os.environ.get('DB_PASSWORD')
        db = os.environ.get('DB_NAME', 'online_study_test')

        for i in range(60):
            try:
                conn = pymysql.connect(host=host, port=port, user=user, password=password, database=db)
                conn.close()
                print('MySQL is available')
                break
            except Exception as e:
                print('Waiting for MySQL...')
                time.sleep(2)
        else:
            print('MySQL not ready')
            sys.exit(1)
        PY

    - name: Start backend server in background
      run: |
        cd backend
        nohup uvicorn app:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
        echo $! > server.pid
        sleep 10

        if curl -f http://localhost:8000/docs > /dev/null 2>&1; then
            echo 'Backend server started successfully'
        else
            echo 'Backend server failed to start'
            cat server.log
            exit 1
        fi

    - name: Run API integration tests
      run: |
        cd backend
        python - <<'PY'
        import httpx
        import json
        import time
        import base64
        import numpy as np
        import cv2
        import sys

        base_url = "http://localhost:8000"
        failed_tests = []

        def assert_status(response, expected_code, test_name):
            if response.status_code != expected_code:
                failed_tests.append(f"{test_name}: expected {expected_code}, got {response.status_code}")
                return False
            return True

        def assert_response_ok(response, test_name):
            data = response.json()
            if data.get("code") != 200:
                failed_tests.append(f"{test_name}: response code is {data.get('code')}, expected 200")
                return False
            return True

        token = ""
        test_room_id = ""
        test_user_id = ""

        # TC-001: User registration and login
        print("\n=== TC-001: User registration and login ===")
        try:
            reg_data = {"phone": "13900000999", "password": "Test123456"}
            response = httpx.post(f"{base_url}/api/user/register", json=reg_data)
            if not assert_status(response, 200, "TC-001 Register"):
                print(f"TC-001 Register failed: {response.text}")
            else:
                assert_response_ok(response, "TC-001 Register")
                data = response.json().get("data", {})
                assert "user_id" in data, "TC-001: user_id not in response"
                assert "token" in data, "TC-001: token not in response"
                print("TC-001: User registration passed")

            login_data = {"phone": "13900000999", "password": "Test123456"}
            response = httpx.post(f"{base_url}/api/user/login", json=login_data)
            if not assert_status(response, 200, "TC-001 Login"):
                print(f"TC-001 Login failed: {response.text}")
            else:
                data = response.json().get("data", {})
                assert "user_id" in data, "TC-001: user_id not in login response"
                assert "token" in data, "TC-001: token not in login response"
                token = data.get("token", "")
                test_user_id = data.get("user_id", "")
                print(f"TC-001: User login passed, user_id: {test_user_id}")
        except Exception as e:
            failed_tests.append(f"TC-001 exception: {e}")
            import traceback
            traceback.print_exc()

        # TC-002: Study room creation
        print("\n=== TC-002: Study room creation ===")
        if token:
            try:
                headers = {"Authorization": f"Bearer {token}"}
                room_data = {"theme": "考研", "max_people": 4, "tags": ["考研", "数学"]}
                response = httpx.post(f"{base_url}/api/room/create", json=room_data, headers=headers)
                if not assert_status(response, 200, "TC-002 Create Room"):
                    print(f"TC-002 Create Room failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-002 Create Room")
                    room_result = response.json().get("data", {})
                    assert "room_id" in room_result, "TC-002: room_id not in response"
                    test_room_id = room_result.get("room_id", "")
                    print(f"TC-002: Room creation passed, room_id: {test_room_id}")
            except Exception as e:
                failed_tests.append(f"TC-002 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-002: skipped due to missing token")

        # TC-003: Study room joining
        print("\n=== TC-003: Study room joining ===")
        if token and test_room_id:
            try:
                headers = {"Authorization": f"Bearer {token}"}
                join_data = {"room_id": test_room_id}
                response = httpx.post(f"{base_url}/api/room/join", json=join_data, headers=headers)
                if not assert_status(response, 200, "TC-003 Join Room"):
                    print(f"TC-003 Join Room failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-003 Join Room")
                    print("TC-003: Room joining passed")
            except Exception as e:
                failed_tests.append(f"TC-003 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-003: skipped due to missing token or room_id")

        # TC-004: Study duration recording
        print("\n=== TC-004: Study duration recording ===")
        if token:
            try:
                headers = {"Authorization": f"Bearer {token}"}
                response = httpx.get(f"{base_url}/api/duration/daily", headers=headers)
                if not assert_status(response, 200, "TC-004 Daily Duration"):
                    print(f"TC-004 Daily Duration failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-004 Daily Duration")
                    data = response.json().get("data", {})
                    assert "total_minutes" in data, "TC-004: total_minutes not in response"
                    print("TC-004: Daily duration passed")

                response = httpx.get(f"{base_url}/api/duration/weekly", headers=headers)
                if not assert_status(response, 200, "TC-004 Weekly Duration"):
                    print(f"TC-004 Weekly Duration failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-004 Weekly Duration")
                    data = response.json().get("data", {})
                    assert isinstance(data, list), "TC-004: weekly data should be a list"
                    print("TC-004: Weekly duration passed")

                response = httpx.get(f"{base_url}/api/duration/period/summary?period=week", headers=headers)
                if not assert_status(response, 200, "TC-004 Period Summary"):
                    print(f"TC-004 Period Summary failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-004 Period Summary")
                    print("TC-004: Period summary passed")
            except Exception as e:
                failed_tests.append(f"TC-004 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-004: skipped due to missing token")

        # TC-005: Leaderboard functionality
        print("\n=== TC-005: Leaderboard functionality ===")
        if token:
            try:
                headers = {"Authorization": f"Bearer {token}"}
                response = httpx.get(f"{base_url}/api/duration/rank", headers=headers)
                if not assert_status(response, 200, "TC-005 Daily Rank"):
                    print(f"TC-005 Daily Rank failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-005 Daily Rank")
                    print("TC-005: Daily leaderboard passed")

                response = httpx.get(f"{base_url}/api/duration/rank/weekly", headers=headers)
                if not assert_status(response, 200, "TC-005 Weekly Rank"):
                    print(f"TC-005 Weekly Rank failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-005 Weekly Rank")
                    print("TC-005: Weekly leaderboard passed")

                response = httpx.get(f"{base_url}/api/duration/rank/monthly", headers=headers)
                if not assert_status(response, 200, "TC-005 Monthly Rank"):
                    print(f"TC-005 Monthly Rank failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-005 Monthly Rank")
                    print("TC-005: Monthly leaderboard passed")
            except Exception as e:
                failed_tests.append(f"TC-005 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-005: skipped due to missing token")

        # TC-006: AI face detection
        print("\n=== TC-006: AI face detection ===")
        if token and test_room_id:
            try:
                headers = {"Authorization": f"Bearer {token}"}
                img = np.zeros((100, 100, 3), dtype=np.uint8)
                img.fill(255)
                _, buffer = cv2.imencode('.jpg', img)
                img_base64 = base64.b64encode(buffer).decode('utf-8')
                img_data = f"data:image/jpeg;base64,{img_base64}"

                detect_data = {"image": img_data, "room_id": test_room_id, "user_id": test_user_id}
                response = httpx.post(f"{base_url}/api/room/detect-person", json=detect_data, headers=headers)
                if not assert_status(response, 200, "TC-006 AI Detection"):
                    print(f"TC-006 AI Detection failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-006 AI Detection")
                    result = response.json().get("data", {})
                    assert "has_person" in result, "TC-006: has_person not in response"
                    print(f"TC-006: AI detection passed, has_person={result.get('has_person')}")
            except Exception as e:
                failed_tests.append(f"TC-006 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-006: skipped due to missing token or room_id")

        # TC-007: User profile and tags
        print("\n=== TC-007: User profile and tags ===")
        if token:
            try:
                headers = {"Authorization": f"Bearer {token}"}

                response = httpx.get(f"{base_url}/api/user/profile", headers=headers)
                if not assert_status(response, 200, "TC-007 Get Profile"):
                    print(f"TC-007 Get Profile failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-007 Get Profile")
                    data = response.json().get("data", {})
                    assert "nickname" in data, "TC-007: nickname not in profile"
                    print("TC-007: Get profile passed")

                response = httpx.get(f"{base_url}/api/user/tags", headers=headers)
                if not assert_status(response, 200, "TC-007 Get Tags"):
                    print(f"TC-007 Get Tags failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-007 Get Tags")
                    data = response.json().get("data", {})
                    assert isinstance(data, list), "TC-007: tags should be a list"
                    print(f"TC-007: Get tags passed, {len(data)} tags available")

                nickname_data = {"nickname": "测试用户"}
                response = httpx.put(f"{base_url}/api/user/profile/nickname", json=nickname_data, headers=headers)
                if not assert_status(response, 200, "TC-007 Update Nickname"):
                    print(f"TC-007 Update Nickname failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-007 Update Nickname")
                    print("TC-007: Update nickname passed")

                if test_user_id:
                    response = httpx.get(f"{base_url}/api/user/info/{test_user_id}", headers=headers)
                    if not assert_status(response, 200, "TC-007 Get User Info"):
                        print(f"TC-007 Get User Info failed: {response.text}")
                    else:
                        assert_response_ok(response, "TC-007 Get User Info")
                        print("TC-007: Get user info passed")
            except Exception as e:
                failed_tests.append(f"TC-007 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-007: skipped due to missing token")

        # TC-008: Check-in functionality
        print("\n=== TC-008: Check-in functionality ===")
        if token:
            try:
                headers = {"Authorization": f"Bearer {token}"}

                response = httpx.post(f"{base_url}/api/user/check-in", headers=headers)
                if not assert_status(response, 200, "TC-008 Check-in"):
                    print(f"TC-008 Check-in failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-008 Check-in")
                    print("TC-008: Check-in passed")

                response = httpx.get(f"{base_url}/api/user/check-in/status", headers=headers)
                if not assert_status(response, 200, "TC-008 Check-in Status"):
                    print(f"TC-008 Check-in Status failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-008 Check-in Status")
                    data = response.json().get("data", {})
                    assert "checked_in_today" in data, "TC-008: checked_in_today not in response"
                    print("TC-008: Check-in status passed")
            except Exception as e:
                failed_tests.append(f"TC-008 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-008: skipped due to missing token")

        # TC-009: Bookmark functionality
        print("\n=== TC-009: Bookmark functionality ===")
        if token:
            try:
                headers = {"Authorization": f"Bearer {token}"}

                bookmark_data = {"title": "测试收藏", "url": "https://example.com", "tags": "测试"}
                response = httpx.post(f"{base_url}/api/bookmark", json=bookmark_data, headers=headers)
                bookmark_id = None
                if not assert_status(response, 200, "TC-009 Create Bookmark"):
                    print(f"TC-009 Create Bookmark failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-009 Create Bookmark")
                    data = response.json().get("data", {})
                    assert "id" in data, "TC-009: id not in bookmark response"
                    bookmark_id = data.get("id")
                    print(f"TC-009: Create bookmark passed, id: {bookmark_id}")

                response = httpx.get(f"{base_url}/api/bookmark", headers=headers)
                if not assert_status(response, 200, "TC-009 Get Bookmarks"):
                    print(f"TC-009 Get Bookmarks failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-009 Get Bookmarks")
                    data = response.json().get("data", {})
                    assert isinstance(data, list), "TC-009: bookmarks should be a list"
                    print(f"TC-009: Get bookmarks passed, count: {len(data)}")

                response = httpx.get(f"{base_url}/api/bookmark/tags", headers=headers)
                if not assert_status(response, 200, "TC-009 Get Bookmark Tags"):
                    print(f"TC-009 Get Bookmark Tags failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-009 Get Bookmark Tags")
                    print("TC-009: Get bookmark tags passed")

                if bookmark_id:
                    update_data = {"tags": "新标签"}
                    response = httpx.put(f"{base_url}/api/bookmark/{bookmark_id}/tags", json=update_data, headers=headers)
                    if not assert_status(response, 200, "TC-009 Update Bookmark Tags"):
                        print(f"TC-009 Update Bookmark Tags failed: {response.text}")
                    else:
                        assert_response_ok(response, "TC-009 Update Bookmark Tags")
                        print("TC-009: Update bookmark tags passed")

                    response = httpx.delete(f"{base_url}/api/bookmark/{bookmark_id}", headers=headers)
                    if not assert_status(response, 200, "TC-009 Delete Bookmark"):
                        print(f"TC-009 Delete Bookmark failed: {response.text}")
                    else:
                        assert_response_ok(response, "TC-009 Delete Bookmark")
                        print("TC-009: Delete bookmark passed")
            except Exception as e:
                failed_tests.append(f"TC-009 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-009: skipped due to missing token")

        # TC-010: Room update and destroy
        print("\n=== TC-010: Room update and destroy ===")
        if token and test_room_id:
            try:
                headers = {"Authorization": f"Bearer {token}"}

                response = httpx.get(f"{base_url}/api/room/info/{test_room_id}", headers=headers)
                if not assert_status(response, 200, "TC-010 Get Room Info"):
                    print(f"TC-010 Get Room Info failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-010 Get Room Info")
                    print("TC-010: Get room info passed")

                update_data = {"theme": "期末考试"}
                response = httpx.put(f"{base_url}/api/room/update/{test_room_id}", json=update_data, headers=headers)
                if not assert_status(response, 200, "TC-010 Update Room"):
                    print(f"TC-010 Update Room failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-010 Update Room")
                    print("TC-010: Room update passed")

                leave_data = {"room_id": test_room_id}
                response = httpx.post(f"{base_url}/api/room/leave", json=leave_data, headers=headers)
                if not assert_status(response, 200, "TC-010 Leave Room"):
                    print(f"TC-010 Leave Room failed: {response.text}")
                else:
                    assert_response_ok(response, "TC-010 Leave Room")
                    print("TC-010: Leave room passed")
            except Exception as e:
                failed_tests.append(f"TC-010 exception: {e}")
                import traceback
                traceback.print_exc()
        else:
            failed_tests.append("TC-010: skipped due to missing token or room_id")

        # TC-011: WebSocket real-time communication
        print("\n=== TC-011: WebSocket real-time communication ===")
        try:
            import websockets
            import asyncio

            async def test_websocket():
                try:
                    room_id = "12345678901234567890123456789012"
                    user_id = "test_user_id"
                    uri = f"ws://localhost:8000/ws/room/{room_id}?user_id={user_id}"
                    async with websockets.connect(uri) as websocket:
                        test_message = {"type": "test", "message": "Integration test"}
                        await websocket.send(json.dumps(test_message))
                        print("TC-011: WebSocket connection and message sent passed")
                except Exception as e:
                    failed_tests.append(f"TC-011 WebSocket exception: {e}")

            asyncio.run(test_websocket())
        except Exception as e:
            failed_tests.append(f"TC-011 exception: {e}")

        print("\n=== Integration Test Summary ===")
        if failed_tests:
            print(f"FAILED: {len(failed_tests)} test(s)")
            for f in failed_tests:
                print(f"  - {f}")
            sys.exit(1)
        else:
            print("PASSED: All API integration tests passed")

        import xml.etree.ElementTree as ET
        import os
        os.makedirs("integration-results", exist_ok=True)

        test_suite = ET.Element("testsuite", name="integration-tests", tests=str(len(failed_tests) if failed_tests else 11), failures=str(len(failed_tests)) if failed_tests else "0", errors="0")

        if failed_tests:
            for failure in failed_tests:
                test_case = ET.SubElement(test_suite, "testcase", name=failure)
                failure_elem = ET.SubElement(test_case, "failure", message=failure)
                failure_elem.text = failure
        else:
            for i in range(1, 12):
                ET.SubElement(test_suite, "testcase", name=f"TC-{str(i).zfill(3)}")

        tree = ET.ElementTree(test_suite)
        tree.write("integration-results/integration-test.xml", encoding="utf-8", xml_declaration=True)
        PY

    - name: Run integration health check
      run: |
        curl -f http://localhost:8000/docs || exit 1
        echo 'Backend API health check passed'

    - name: Run data consistency test
      run: |
        cd backend
        python - <<'PY'
        from utils.cache import _redis
        from config.db import engine
        from sqlalchemy import text

        r = _redis()
        test_key = "test_data_consistency"
        test_value = "test_value"
        r.set(test_key, test_value, ex=60)
        retrieved = r.get(test_key)
        if retrieved:
            print("Redis connection test passed")

        with engine.connect() as conn:
            result = conn.execute(text('SELECT 1'))
            print("Database connection test passed")

        print("Data consistency test completed")
        PY

    - name: Run performance test
      run: |
        cd backend
        python - <<'PY'
        import httpx
        import time

        base_url = "http://localhost:8000"

        start_time = time.time()
        for i in range(10):
            response = httpx.get(f"{base_url}/api/room/list")
        end_time = time.time()

        avg_response_time = (end_time - start_time) / 10
        print(f"Average API response time: {avg_response_time:.3f}s")

        if avg_response_time < 0.5:
            print("Performance test passed")
        else:
            print("Performance test: Response time above threshold")
        PY

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: backend/integration-results
        retention-days: 7

    - name: Clean up
      if: always()
      run: |
        if [ -f backend/server.pid ]; then
            kill $(cat backend/server.pid) 2>/dev/null || true
            rm -f backend/server.pid
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security scan for Python dependencies
      run: |
        cd backend
        pip install safety bandit

        safety check -r requirements.txt --output json > security_report.json || true
        bandit -r . -f json -o bandit_report.json || true

        echo 'Security scan completed'

    - name: Run security scan for Node.js dependencies
      run: |
        cd frontend
        npm audit --audit-level moderate --json > npm_audit_report.json || true
        echo 'NPM security audit completed'

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          backend/security_report.json
          backend/bandit_report.json
          frontend/npm_audit_report.json
        retention-days: 7

  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, integration-test, security-scan]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Download backend test results
      uses: actions/download-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: backend/test-results

    - name: Download integration test results
      uses: actions/download-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: backend/integration-results

    - name: Generate comprehensive test summary
      run: |
        python - <<'PY'
        import os
        import xml.etree.ElementTree as ET
        from datetime import datetime

        def parse_junit_xml(filepath):
            if not os.path.exists(filepath):
                return {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "passed": 0}
            try:
                tree = ET.parse(filepath)
                root = tree.getroot()
                tests = int(root.get("tests", 0))
                failures = int(root.get("failures", 0))
                errors = int(root.get("errors", 0))
                skipped = int(root.get("skipped", 0))
                return {
                    "tests": tests,
                    "failures": failures,
                    "errors": errors,
                    "skipped": skipped,
                    "passed": tests - failures - errors - skipped
                }
            except Exception as e:
                return {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "passed": 0, "error": str(e)}

        backend_results = parse_junit_xml("backend/test-results/backend-test.xml")
        integration_results = parse_junit_xml("backend/integration-results/integration-test.xml")

        backend_status = "PASSED" if backend_results["failures"] == 0 and backend_results["errors"] == 0 else "FAILED"
        integration_status = "PASSED" if integration_results["failures"] == 0 and integration_results["errors"] == 0 else "FAILED"

        with open("test-summary.md", "w") as f:
            f.write("# Online Study System - Comprehensive Test Report\n\n")
            f.write(f"Generated at: {datetime.now().isoformat()}\n\n")
            f.write("## Project Status\n\n")
            overall_status = "PASSED" if backend_status == "PASSED" and integration_status == "PASSED" else "FAILED"
            f.write(f"**Overall Status: {overall_status}**\n\n")
            f.write("## Test Results Summary\n\n")
            f.write("| Test Suite | Status | Tests | Passed | Failed | Errors |\n")
            f.write("|------------|--------|-------|--------|--------|--------|\n")
            f.write(f"| Backend Tests (pytest) | {backend_status} | {backend_results['tests']} | {backend_results['passed']} | {backend_results['failures']} | {backend_results['errors']} |\n")
            f.write(f"| Integration Tests | {integration_status} | {integration_results['tests']} | {integration_results['passed']} | {integration_results['failures']} | {integration_results['errors']} |\n")
            f.write(f"| Frontend Tests | PASSED | - | - | - | - |\n")
            f.write(f"| Security Scan | COMPLETED | - | - | - | - |\n")
            f.write("\n## Test Coverage\n\n")
            f.write("- TC-001: User registration and login\n")
            f.write("- TC-002: Study room creation\n")
            f.write("- TC-003: Study room joining\n")
            f.write("- TC-004: Learning duration recording\n")
            f.write("- TC-005: Leaderboard functionality\n")
            f.write("- TC-006: AI detection functionality\n")
            f.write("- TC-007: User profile and tags management\n")
            f.write("- TC-008: Check-in functionality\n")
            f.write("- TC-009: Bookmark functionality\n")
            f.write("- TC-010: Room update and destroy\n")
            f.write("- TC-011: WebSocket real-time communication\n")
            f.write("\n## Implemented Features\n\n")
            f.write("- User system (register, login, profile, tags, check-in)\n")
            f.write("- Study room management (CRUD, join/leave, WebSocket broadcast)\n")
            f.write("- Learning duration tracking (daily/weekly/monthly, leaderboards)\n")
            f.write("- AI face detection (OpenCV Haar Cascade)\n")
            f.write("- Bookmark collection\n")
            f.write("- WebSocket real-time communication\n")
            f.write("\n## API Endpoints Coverage\n\n")
            f.write("- /api/user/* - User management endpoints\n")
            f.write("- /api/room/* - Study room management endpoints\n")
            f.write("- /api/duration/* - Learning duration endpoints\n")
            f.write("- /api/bookmark/* - Bookmark collection endpoints\n")
            f.write("- /ws/room/* - WebSocket endpoint\n")

        print("Test summary report generated:")
        print(f"Backend Tests: {backend_status} ({backend_results['passed']}/{backend_results['tests']} passed)")
        print(f"Integration Tests: {integration_status} ({integration_results['passed']}/{integration_results['tests']} passed)")
        PY

    - name: Upload test summary
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: test-summary.md
        retention-days: 30

    - name: Send success notification
      if: success()
      run: |
        echo 'All tests passed! The Online Study System is ready for deployment.'

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, integration-test]
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Report failure
        run: |
          echo "CI/CD pipeline failed. Please check the logs for details."
          echo "Failed job: ${{ needs }}"
