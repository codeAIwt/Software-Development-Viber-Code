version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: online-study-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:root_password@mysql:3306/online_study?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD:root_password
      - DB_NAME=online_study
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - online-study-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: online-study-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - online-study-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: online-study-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=online_study
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - online-study-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: online-study-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - online-study-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  online-study-network:
    driver: bridge